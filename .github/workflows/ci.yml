name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear .env de prueba (sin secretos reales)
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder" >> .env

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Correr tests con cobertura
        run: flutter test --coverage

      - name: Guardar el reporte de cobertura en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage/lcov.info
          if git diff --staged --quiet; then
            echo "Sin cambios en cobertura, no se hace commit."
          else
            git commit -m "chore: actualizar reporte de cobertura [skip ci]"
            git push
          fi

      - name: Analisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}